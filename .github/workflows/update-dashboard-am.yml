name: Update Dashboard AM (Catálogo)

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: am
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # always fetch the latest commit, not the triggering one

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate catalog from Redash
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
        run: python update_dashboard.py

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update catalog $(date +'%Y-%m-%d %H:%M')"
          git push
