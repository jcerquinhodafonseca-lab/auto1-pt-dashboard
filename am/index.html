<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto1 Portugal — Dashboard AM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF5C00;--blue:#003C7E;--blue2:#0052A5;
  --dark:#1A1A2A;--muted:rgba(26,26,42,.5);--border:rgba(26,26,42,.1);
  --card:#fff;--bg:#F4F6FA;--green:#2E7D32;--red:#C62828;--amber:#E65100;
}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--dark);min-height:100vh}

/* ── LOGIN ── */
#login-overlay{
  position:fixed;inset:0;background:var(--blue);
  display:flex;align-items:center;justify-content:center;z-index:9999;
}
.login-box{
  background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo svg{height:36px}
.login-box h2{font-size:20px;font-weight:700;text-align:center;margin-bottom:6px;color:var(--dark)}
.login-box p{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.login-box input{
  width:100%;border:1.5px solid var(--border);border-radius:8px;
  padding:11px 14px;font-size:14px;margin-bottom:12px;outline:none;
  transition:border-color .15s;
}
.login-box input:focus{border-color:var(--blue)}
.btn-primary{
  width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;
  padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;
}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.5;cursor:default}
.login-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.login-toggle a{color:var(--orange);cursor:pointer;font-weight:600}
.login-err{color:var(--red);font-size:12px;text-align:center;margin-top:8px;min-height:18px}
.login-info{color:var(--green);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* ── HEADER ── */
.header{
  background:var(--blue);padding:0 24px;display:flex;align-items:center;gap:16px;
  height:54px;box-shadow:0 2px 8px rgba(0,0,0,.18);position:sticky;top:0;z-index:100;
}
.header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.header-logo svg{height:30px}
.header-title{color:rgba(255,255,255,.5);font-size:12px;border-left:1px solid rgba(255,255,255,.2);padding-left:14px;margin-left:2px}
.header-user{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-badge{
  background:rgba(255,255,255,.15);color:#fff;font-size:12px;
  padding:4px 10px;border-radius:20px;
}
.btn-logout{
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:background .15s;
}
.btn-logout:hover{background:rgba(255,255,255,.22)}
.gen-date{color:rgba(255,255,255,.35);font-size:11px}

/* ── TABS ── */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0}
.tab-btn{
  padding:13px 18px;font-size:13px;font-weight:600;color:var(--muted);
  border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;
  transition:color .15s,border-color .15s;
}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange)}
.tab-btn:hover:not(.active){color:var(--dark)}

/* ── FILTERS ── */
.filters{
  background:#fff;border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.filters select,.filters input{
  border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;
  font-size:13px;background:#fff;color:var(--dark);outline:none;
}
.filters select:focus,.filters input:focus{border-color:var(--blue2)}
.filters input[type=text]{width:200px}
.filter-count{font-size:12px;color:var(--muted);margin-left:4px}
.btn-clear{
  background:none;border:1.5px solid var(--border);border-radius:7px;
  padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;
}
.btn-clear:hover{border-color:var(--orange);color:var(--orange)}

/* ── CAR GRID ── */
#cars-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:12px;padding:16px 24px;
}
.car-card{
  background:var(--card);border-radius:10px;border:1.5px solid var(--border);
  padding:16px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;
}
.car-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.09);border-color:var(--orange)}
.car-stock{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.5px;margin-bottom:4px}
.car-name{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:2px}
.car-sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.car-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tag{font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted)}
.car-price{font-size:18px;font-weight:800;color:var(--blue)}
.car-price span{font-size:12px;font-weight:400;color:var(--muted)}
.no-price{color:var(--muted);font-size:13px}

/* ── PROPOSAL PANEL ── */
#proposal-panel{padding:20px 24px;display:none}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:1.5px solid var(--border);border-radius:7px;
  padding:7px 14px;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:16px;
}
.back-btn:hover{border-color:var(--orange);color:var(--orange)}
.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.prop-grid{grid-template-columns:1fr}}
.prop-card{background:#fff;border-radius:10px;border:1.5px solid var(--border);padding:20px}
.prop-card h3{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.car-hero{background:var(--blue);border-radius:10px;padding:20px;margin-bottom:16px;color:#fff}
.car-hero-name{font-size:20px;font-weight:800;margin-bottom:4px}
.car-hero-sub{font-size:13px;opacity:.7;margin-bottom:12px}
.car-hero-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hero-tag{font-size:11px;background:rgba(255,255,255,.15);border-radius:4px;padding:3px 8px}
.car-hero-price{font-size:28px;font-weight:800}
.car-hero-price span{font-size:14px;font-weight:400;opacity:.7}
.car-hero-link{
  display:inline-block;margin-top:10px;font-size:12px;color:rgba(255,255,255,.8);
  text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:4px 10px;
}
.car-hero-link:hover{background:rgba(255,255,255,.1)}
.field-row{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.field-row label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field-row input{
  border:1.5px solid var(--border);border-radius:7px;padding:9px 11px;
  font-size:14px;outline:none;transition:border-color .15s;
}
.field-row input:focus{border-color:var(--blue2)}
.calc-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;
}
.calc-row:last-child{border-bottom:none}
.calc-label{color:var(--muted)}
.calc-val{font-weight:600}
.calc-total{
  background:var(--blue);color:#fff;border-radius:8px;
  padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;
}
.calc-total-label{font-size:12px;opacity:.8}
.calc-total-val{font-size:22px;font-weight:800}
.calc-diff{margin-top:8px;padding:10px 12px;border-radius:7px;font-size:13px;display:flex;justify-content:space-between}
.diff-pos{background:#E8F5E9;color:#2E7D32}
.diff-neg{background:#FFEBEE;color:#C62828}
.msg-box{
  background:var(--bg);border-radius:8px;padding:14px;
  font-size:13px;line-height:1.6;white-space:pre-wrap;min-height:100px;
  border:1.5px solid var(--border);margin-bottom:12px;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-copy{
  flex:1;background:var(--blue2);color:#fff;border:none;border-radius:8px;
  padding:11px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;min-width:130px;
}
.btn-copy:hover{opacity:.88}
.btn-wa{
  flex:1;background:#25D366;color:#fff;border:none;border-radius:8px;
  padding:11px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;min-width:130px;
}
.btn-wa:hover{opacity:.88}
.save-indicator{font-size:12px;color:var(--green);text-align:center;margin-top:8px;min-height:16px}

/* ── HISTORY ── */
#history-panel{padding:20px 24px;display:none}
.hist-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hist-header h2{font-size:16px;font-weight:700}
.admin-filter{display:flex;align-items:center;gap:8px}
.admin-filter label{font-size:12px;color:var(--muted)}
.admin-filter select{
  border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:13px;
}
.hist-tabs{display:flex;gap:0;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:14px;width:fit-content}
.htab{
  padding:7px 16px;font-size:13px;font-weight:600;border:none;background:none;
  border-radius:6px;cursor:pointer;color:var(--muted);transition:all .15s;
}
.htab.active{background:#fff;color:var(--dark);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.hist-empty{text-align:center;padding:48px;color:var(--muted);font-size:13px}
.hist-item{
  background:#fff;border-radius:10px;border:1.5px solid var(--border);
  padding:16px;margin-bottom:10px;
}
.hist-item-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.hist-car-name{font-size:14px;font-weight:700}
.hist-car-sub{font-size:12px;color:var(--muted);margin-top:2px}
.hist-meta{font-size:11px;color:var(--muted)}
.hist-am-badge{
  font-size:11px;background:#EEF2FF;color:var(--blue);
  padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap;
}
.hist-prices{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px}
.hist-price-item{font-size:12px}
.hist-price-item .lbl{color:var(--muted);display:block}
.hist-price-item .val{font-weight:700;font-size:13px}
.status-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.st-btn{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  border:1.5px solid;cursor:pointer;transition:all .15s;background:#fff;
}
.st-btn.nv{border-color:#C62828;color:#C62828}.st-btn.nv.active{background:#C62828;color:#fff}
.st-btn.vd{border-color:#2E7D32;color:#2E7D32}.st-btn.vd.active{background:#2E7D32;color:#fff}
.st-btn.lc{border-color:#E65100;color:#E65100}.st-btn.lc.active{background:#E65100;color:#fff}
.sale-fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sale-fields input{
  border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;
  font-size:13px;width:160px;outline:none;
}
.sale-fields input:focus{border-color:var(--blue2)}
.ci-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dark)}
.ci-wrap input[type=checkbox]{width:15px;height:15px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot-red{background:#C62828}.dot-green{background:#2E7D32}.dot-amber{background:#E65100}.dot-grey{background:#999}
.hist-msg-toggle{font-size:12px;color:var(--orange);cursor:pointer;margin-top:6px;display:inline-block}
.hist-msg{
  background:var(--bg);border-radius:6px;padding:10px;font-size:12px;
  line-height:1.6;white-space:pre-wrap;margin-top:6px;display:none;border:1px solid var(--border);
}

/* ── VENDAS ── */
#vendas-panel{padding:20px 24px;display:none}
.vendas-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:10px;border:1.5px solid var(--border);padding:18px}
.stat-card .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.stat-card .val{font-size:28px;font-weight:800;color:var(--dark)}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.vendas-list h3{font-size:14px;font-weight:700;margin-bottom:12px}

/* ── LOADING ── */
.loading{text-align:center;padding:48px;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
<div class="login-box">
  <div class="login-logo">
    <svg viewBox="0 0 120 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="28" font-family="system-ui" font-size="28" font-weight="800" fill="#FF5C00">auto1</text>
    </svg>
  </div>
  <h2>Dashboard AM</h2>
  <p id="login-subtitle">Portugal — Catálogo de Carros</p>
  <div id="login-form">
    <input type="email" id="inp-email" placeholder="O teu email (@auto1.com)" autocomplete="email">
    <input type="password" id="inp-pass" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()" id="btn-login">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-info" id="login-info"></div>
    <div class="login-toggle">Primeira vez? <a onclick="showSignup()">Criar conta</a></div>
  </div>
  <div id="signup-form" style="display:none">
    <input type="text" id="inp-name" placeholder="O teu nome">
    <input type="email" id="inp-su-email" placeholder="O teu email (@auto1.com)" autocomplete="email">
    <input type="password" id="inp-su-pass" placeholder="Password (mínimo 6 caracteres)" autocomplete="new-password">
    <button class="btn-primary" onclick="doSignup()" id="btn-signup">Criar conta</button>
    <div class="login-err" id="signup-err"></div>
    <div class="login-info" id="signup-info"></div>
    <div class="login-toggle">Já tens conta? <a onclick="showLogin()">Entrar</a></div>
  </div>
</div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 80 24" fill="none"><text x="0" y="19" font-family="system-ui" font-size="19" font-weight="800" fill="#FF5C00">auto1</text></svg>
  </div>
  <span class="header-title">Dashboard AM · Portugal</span>
  <div class="header-user">
    <span class="gen-date" id="gen-date-hdr">Catálogo: 16/07/2026 15:54</span>
    <span class="user-badge" id="user-badge"></span>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('catalog')" id="tab-catalog-btn">Catálogo PT (<span id="cars-count">0</span>)</button>
  <button class="tab-btn" onclick="showTab('history')" id="tab-history-btn">Histórico (<span id="hist-count">0</span>)</button>
  <button class="tab-btn" onclick="showTab('vendas')" id="tab-vendas-btn">Vendas</button>
</div>

<!-- CATALOG TAB -->
<div id="catalog-section">
  <div class="filters">
    <input type="text" id="f-search" placeholder="Pesquisar stock, marca, modelo..." oninput="filterCars()">
    <select id="f-brand" onchange="filterCars()">
      <option value="">Todas as marcas</option>
    </select>
    <select id="f-fuel" onchange="filterCars()">
      <option value="">Todos os combustíveis</option>
    </select>
    <select id="f-cond" onchange="filterCars()">
      <option value="">Todas as condições</option>
      <option>Não acidentado</option>
      <option>Acidentado</option>
    </select>
    <select id="f-km" onchange="filterCars()">
      <option value="">Todos os kms</option>
      <option value="0-50000">Até 50.000 km</option>
      <option value="50000-100000">50.000 – 100.000 km</option>
      <option value="100000-150000">100.000 – 150.000 km</option>
      <option value="150000-200000">150.000 – 200.000 km</option>
      <option value="200000-250000">200.000 – 250.000 km</option>
      <option value="250000-999999">Mais de 250.000 km</option>
    </select>
    <span class="filter-count" id="filter-count"></span>
    <button class="btn-clear" onclick="clearFilters()">Limpar filtros</button>
  </div>
  <div id="cars-grid"></div>
</div>

<!-- PROPOSAL PANEL (replaces catalog) -->
<div id="proposal-panel">
  <button class="back-btn" onclick="closeProp()">&#8592; Voltar ao catálogo</button>
  <div id="prop-content"></div>
</div>

<!-- HISTORY PANEL -->
<div id="history-panel">
  <div class="hist-header">
    <h2>Histórico de Propostas</h2>
    <div id="admin-filter-wrap" style="display:none" class="admin-filter">
      <label>Filtrar por AM:</label>
      <select id="admin-am-filter" onchange="renderHistory()">
        <option value="">Todos os AMs</option>
      </select>
    </div>
  </div>
  <div class="hist-tabs">
    <button class="htab active" onclick="switchHTab('all')" id="htab-all">Todas</button>
    <button class="htab" onclick="switchHTab('vendido')" id="htab-vendido">Vendidas</button>
    <button class="htab" onclick="switchHTab('licitado')" id="htab-licitado">Licitadas</button>
    <button class="htab" onclick="switchHTab('pending')" id="htab-pending">Em aberto</button>
  </div>
  <div id="hist-list"></div>
</div>

<!-- VENDAS PANEL -->
<div id="vendas-panel">
  <div class="vendas-stats" id="vendas-stats"></div>
  <div class="vendas-list" id="vendas-list"></div>
</div>

</div><!-- #app -->

<script>
const SUPABASE_URL = 'https://dtwesvwofrxqansmxusd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8PPJtupmWkGCd5x095b7gg_hL3Trv_h';

// ── AUTH ──────────────────────────────────────────────────────────────────
function showSignup() {
  document.getElementById('login-form').style.display='none';
  document.getElementById('signup-form').style.display='block';
}
function showLogin() {
  document.getElementById('signup-form').style.display='none';
  document.getElementById('login-form').style.display='block';
}

async function doLogin() {
  const email = document.getElementById('inp-email').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  const btn   = document.getElementById('btn-login');
  const err   = document.getElementById('login-err');
  const info  = document.getElementById('login-info');
  err.textContent=''; info.textContent='';
  if (!email||!pass) { err.textContent='Preenche email e password.'; return; }
  btn.disabled=true; btn.textContent='A entrar...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  btn.disabled=false; btn.textContent='Entrar';
  if (error) { err.textContent = translateAuthError(error.message); return; }
  onLogin(data.user);
}

async function doSignup() {
  const name  = document.getElementById('inp-name').value.trim();
  const email = document.getElementById('inp-su-email').value.trim();
  const pass  = document.getElementById('inp-su-pass').value;
  const btn   = document.getElementById('btn-signup');
  const err   = document.getElementById('signup-err');
  const info  = document.getElementById('signup-info');
  err.textContent=''; info.textContent='';
  if (!name||!email||!pass) { err.textContent='Preenche todos os campos.'; return; }
  if (pass.length<6) { err.textContent='Password deve ter pelo menos 6 caracteres.'; return; }
  btn.disabled=true; btn.textContent='A criar conta...';
  const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ name } } });
  btn.disabled=false; btn.textContent='Criar conta';
  if (error) { err.textContent = translateAuthError(error.message); return; }
  if (data.user && data.user.identities && data.user.identities.length===0) {
    err.textContent='Este email já tem conta. Faz login em vez disso.'; return;
  }
  if (data.session) {
    onLogin(data.user);
  } else {
    info.textContent='Conta criada! Verifica o teu email e clica no link de confirmação.';
  }
}

async function doLogout() {
  await sb.auth.signOut();
  currentUser=null; proposals=[];
  document.getElementById('app').style.display='none';
  document.getElementById('login-overlay').style.display='flex';
  document.getElementById('inp-email').value='';
  document.getElementById('inp-pass').value='';
}

function onLogin(user) {
  currentUser = user;
  document.getElementById('login-overlay').style.display='none';
  document.getElementById('app').style.display='block';
  const name = user.user_metadata?.name || user.email.split('@')[0];
  document.getElementById('user-badge').textContent = name;
  if (user.email === ADMIN_EMAIL) {
    document.getElementById('admin-filter-wrap').style.display='flex';
  }
  loadProposals();
  showTab('catalog');
  filterCars();
}

function translateAuthError(msg) {
  if (msg.includes('Invalid login')) return 'Email ou password incorretos.';
  if (msg.includes('Email not confirmed')) return 'Confirma o teu email primeiro (verifica a caixa de entrada).';
  if (msg.includes('User already registered')) return 'Este email já tem conta. Faz login.';
  if (msg.includes('Password should be')) return 'Password demasiado curta (mínimo 6 caracteres).';
  return msg;
}

// ── INIT AUTH ─────────────────────────────────────────────────────────────
(async function() {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    onLogin(session.user);
  }
  sb.auth.onAuthStateChange((_event, session) => {
    if (session?.user && !currentUser) onLogin(session.user);
  });
})();

// ── TABS ──────────────────────────────────────────────────────────────────
function showTab(tab) {
  activeTab = tab;
  ['catalog','history','vendas'].forEach(t => {
    document.getElementById(`tab-${t}-btn`).classList.toggle('active', t===tab);
  });
  document.getElementById('catalog-section').style.display  = tab==='catalog'  ? '' : 'none';
  document.getElementById('proposal-panel').style.display   = 'none';
  document.getElementById('history-panel').style.display    = tab==='history'  ? 'block' : 'none';
  document.getElementById('vendas-panel').style.display     = tab==='vendas'   ? 'block' : 'none';
  if (tab==='history') renderHistory();
  if (tab==='vendas')  renderVendas();
}

// ── CATALOG ───────────────────────────────────────────────────────────────
function kmInRange(km, range) {
  if (!range) return true;
  const [lo,hi] = range.split('-').map(Number);
  return (km||0) >= lo && (km||0) < hi;
}

function filterCars() {
  const q    = document.getElementById('f-search').value.toLowerCase();
  const br   = document.getElementById('f-brand').value;
  const fu   = document.getElementById('f-fuel').value;
  const co   = document.getElementById('f-cond').value;
  const km   = document.getElementById('f-km').value;
  filtered = ALL_CARS.filter(c =>
    (!q  || (c.s+c.mk+c.mo).toLowerCase().includes(q)) &&
    (!br || c.mk===br) &&
    (!fu || c.f===fu) &&
    (!co || c.c===co) &&
    kmInRange(c.km, km)
  );
  document.getElementById('filter-count').textContent = `${filtered.length} de ${ALL_CARS.length} carros`;
  renderCatalog();
}

function clearFilters() {
  ['f-search','f-brand','f-fuel','f-cond','f-km'].forEach(id => {
    const el = document.getElementById(id);
    el.value = (el.tagName==='SELECT') ? '' : '';
  });
  filterCars();
}

function fmtKm(km) {
  if (!km) return '—';
  return new Intl.NumberFormat('pt-PT').format(km) + ' km';
}
function fmtEur(v) {
  if (!v && v!==0) return '—';
  return '€ ' + new Intl.NumberFormat('pt-PT').format(v);
}

function renderCatalog() {
  const grid = document.getElementById('cars-grid');
  if (!filtered.length) {
    grid.innerHTML='<div class="loading">Nenhum carro encontrado.</div>'; return;
  }
  grid.innerHTML = filtered.map((c,i) => `
    <div class="car-card" onclick="openCar(${ALL_CARS.indexOf(c)})">
      <div class="car-stock">${c.s}</div>
      <div class="car-name">${c.mk} ${c.mo}</div>
      <div class="car-sub">${c.y||'—'} · ${fmtKm(c.km)}</div>
      <div class="car-tags">
        <span class="tag">${c.f||'—'}</span>
        <span class="tag">${c.c}</span>
        <span class="tag">${c.o}</span>
      </div>
      ${c.p ? `<div class="car-price">€ ${new Intl.NumberFormat('pt-PT').format(c.p)} <span>preço auto1</span></div>`
             : '<div class="no-price">Sem preço</div>'}
    </div>`).join('');
}

          <div class="field-row"><label>ID do Cliente</label><input id="p-client-id" placeholder="ex: 12345" type="text"></div>
          <div class="field-row"><label>Nome do Cliente</label><input id="p-client-name" placeholder="Nome do cliente"></div>
          <div class="field-row"><label>Teu Nome (AM)</label><input id="p-am-name" placeholder="O teu nome"></div>
        </div>
        <div class="prop-card" style="margin-top:12px">
          <h3>Calculadora de Margem</h3>
          <div class="field-row"><label>PVP Ideal (€)</label><input id="p-pvp" type="number" placeholder="0" oninput="calcMargin()"></div>
          <div class="field-row"><label>Custos de Serviço (€)</label><input id="p-svc" type="number" placeholder="0" oninput="calcMargin()"></div>
          <div class="field-row"><label>Transporte (€)</label><input id="p-trp" type="number" placeholder="0" oninput="calcMargin()"></div>
          <div class="field-row"><label>Obra (€)</label><input id="p-obra" type="number" placeholder="0" oninput="calcMargin()"></div>
          <div class="field-row"><label>Margem Bruta (€)</label><input id="p-margin" type="number" placeholder="0" oninput="calcMargin()"></div>
          <div class="calc-total" id="calc-total">
            <div><div class="calc-total-label">Preço ideal de compra</div><div class="calc-total-val" id="calc-ideal">—</div></div>
          </div>
          <div id="calc-diff" class="calc-diff" style="display:none"></div>
        </div>
      </div>
      <div>
        <div class="prop-card">
          <h3>Mensagem para WhatsApp</h3>
          <div class="msg-box" id="msg-preview"></div>
          <div class="btn-row">
            <button class="btn-copy" onclick="copyMsg()">&#128203; Copiar mensagem</button>
            <button class="btn-wa" onclick="sendWA()">&#128232; WhatsApp</button>
          </div>
          <div class="save-indicator" id="save-indicator"></div>
        </div>
      </div>
    </div>`;
  calcMargin();
}

function closeProp() {
  document.getElementById('proposal-panel').style.display='none';
  document.getElementById('catalog-section').style.display='';
  currentCar=null;
}

function calcMargin() {
  if (!currentCar) return;
  const c = currentCar;
  const pvp    = parseFloat(document.getElementById('p-pvp')?.value)||0;
  const svc    = parseFloat(document.getElementById('p-svc')?.value)||0;
  const trp    = parseFloat(document.getElementById('p-trp')?.value)||0;
  const obra   = parseFloat(document.getElementById('p-obra')?.value)||0;
  const margin = parseFloat(document.getElementById('p-margin')?.value)||0;
  const ideal  = pvp - svc - trp - obra - margin;
  const a1     = c.p || 0;
  const diff   = a1 - ideal;

  const idealEl = document.getElementById('calc-ideal');
  const diffEl  = document.getElementById('calc-diff');
  if (idealEl) {
    idealEl.textContent = pvp ? fmtEur(ideal) : '—';
    if (pvp && a1) {
      diffEl.style.display='flex';
      diffEl.className = 'calc-diff ' + (diff<=0?'diff-pos':'diff-neg');
      diffEl.innerHTML = `<span>Preço auto1 vs. ideal</span><span><b>${diff<=0?'':'+'}${fmtEur(Math.abs(diff))}</b> ${diff<=0?'favorável':'acima do ideal'}</span>`;
    } else { diffEl.style.display='none'; }
  }
  buildMsg(pvp, svc, trp, obra, margin, ideal, diff, a1);
}

function buildMsg(pvp, svc, trp, obra, margin, ideal, diff, a1) {
  if (!currentCar) return;
  const c = currentCar;
  const name = `${c.mk} ${c.mo} - ${c.y||'—'} - ${fmtKm(c.km)} - ${c.c} - ${c.o}`;
  let parts = [];
  if (pvp)    parts.push(`€ ${new Intl.NumberFormat('pt-PT').format(pvp)} (PVP ideal)`);
  if (svc)    parts.push(`€ ${new Intl.NumberFormat('pt-PT').format(svc)} (Custos de serviço)`);
  if (trp)    parts.push(`€ ${new Intl.NumberFormat('pt-PT').format(trp)} (Transporte)`);
  if (obra)   parts.push(`€ ${new Intl.NumberFormat('pt-PT').format(obra)} (Obra)`);
  if (margin) parts.push(`€ ${new Intl.NumberFormat('pt-PT').format(margin)} (Margem bruta)`);
  let calc = '';
  if (parts.length) calc = '\n' + parts.join(' - ') + (pvp ? ` = ${fmtEur(ideal)} (Preço ideal de compra)` : '');
  let priceNote = '';
  if (a1 && diff < 0) {
    priceNote = `\nO nosso está no site a ${fmtEur(a1)}, estando ${fmtEur(Math.abs(diff))} mais barato, o que incrementa à margem bruta`;
  } else if (a1 && diff > 0) {
    priceNote = `\nO nosso está no site a ${fmtEur(a1)}`;
  }
  const msg = `${name}${calc}${priceNote}\n\n🔗 https://www.auto1.com/pt/app/merchant/car/${c.s}`;
  const el = document.getElementById('msg-preview');
  if (el) el.textContent = msg;
}

function getMsg() {
  return document.getElementById('msg-preview')?.textContent || '';
}

async function saveProposal(silent=false) {
  if (!currentCar || !currentUser) return;
  const c = currentCar;
  const pvp    = parseFloat(document.getElementById('p-pvp')?.value)||0;
  const svc    = parseFloat(document.getElementById('p-svc')?.value)||0;
  const trp    = parseFloat(document.getElementById('p-trp')?.value)||0;
  const obra   = parseFloat(document.getElementById('p-obra')?.value)||0;
  const margin = parseFloat(document.getElementById('p-margin')?.value)||0;
  const ideal  = pvp-svc-trp-obra-margin;
  const a1     = c.p||0;
  const rec = {
    user_id:       currentUser.id,
    user_email:    currentUser.email,
    stock_number:  c.s,
    make:          c.mk,
    model:         c.mo,
    built_year:    c.y,
    mileage:       c.km,
    auto1_price:   a1,
    pvp_ideal:     pvp,
    service_costs: svc,
    transport:     trp,
    obra:          obra,
    margin:        margin,
    ideal_buy_price: ideal,
    difference:    a1-ideal,
    client_id:     document.getElementById('p-client-id')?.value||'',
    client_name:   document.getElementById('p-client-name')?.value||'',
    am_name:       document.getElementById('p-am-name')?.value || (currentUser.user_metadata?.name||''),
    message:       getMsg(),
    sale_status:   'pending',
  };
  const { data, error } = await sb.from('proposals').insert(rec).select().single();
  if (!error && data) {
    proposals.unshift(data);
    document.getElementById('hist-count').textContent = proposals.length;
    if (!silent) {
      const ind = document.getElementById('save-indicator');
      if (ind) { ind.textContent='✓ Guardado no histórico'; setTimeout(()=>ind.textContent='',3000); }
    }
  }
}

async function copyMsg() {
  const msg = getMsg();
  if (!msg) return;
  await navigator.clipboard.writeText(msg).catch(()=>{});
  saveProposal();
  const ind = document.getElementById('save-indicator');
  if (ind) { ind.textContent='✓ Copiado e guardado!'; setTimeout(()=>ind.textContent='',3000); }
}

async function sendWA() {
  const msg = getMsg();
  if (!msg) return;
  saveProposal();
  window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
}

// ── PROPOSALS / HISTORY ───────────────────────────────────────────────────
async function loadProposals() {
  const { data, error } = await sb.from('proposals').select('*').order('created_at', {ascending:false});
  if (!error) {
    proposals = data || [];
    document.getElementById('hist-count').textContent = proposals.length;
    if (currentUser.email === ADMIN_EMAIL) {
      const emails = [...new Set(proposals.map(p=>p.user_email).filter(Boolean))].sort();
      const sel = document.getElementById('admin-am-filter');
      sel.innerHTML = '<option value="">Todos os AMs</option>' + emails.map(e=>`<option>${e}</option>`).join('');
    }
    renderVendas();
  }
}

function switchHTab(tab) {
  activeHTab = tab;
  ['all','vendido','licitado','pending'].forEach(t => {
    document.getElementById(`htab-${t}`).classList.toggle('active', t===tab);
  });
  renderHistory();
}

function renderHistory() {
  let list = [...proposals];
  if (activeHTab==='vendido')  list = list.filter(p=>p.sale_status==='vendido');
  if (activeHTab==='licitado') list = list.filter(p=>p.sale_status==='licitado');
  if (activeHTab==='pending')  list = list.filter(p=>p.sale_status==='pending'||!p.sale_status);
  if (currentUser?.email===ADMIN_EMAIL) {
    const filterEmail = document.getElementById('admin-am-filter')?.value;
    if (filterEmail) list = list.filter(p=>p.user_email===filterEmail);
  }
  const el = document.getElementById('hist-list');
  if (!list.length) { el.innerHTML='<div class="hist-empty">Nenhuma proposta aqui ainda.</div>'; return; }
  el.innerHTML = list.map(p => {
    const dot = {vendido:'dot-green',licitado:'dot-amber',pending:'dot-grey',nao_vendido:'dot-red'}[p.sale_status||'pending'] || 'dot-grey';
    const dt  = p.created_at ? new Date(p.created_at).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    const isAdmin = currentUser?.email===ADMIN_EMAIL;
    return `
    <div class="hist-item" id="hitem-${p.id}">
      <div class="hist-item-header">
        <div>
          <div class="hist-car-name"><span class="dot ${dot}" style="margin-right:6px"></span>${p.make} ${p.model}</div>
          <div class="hist-car-sub">${p.built_year||'—'} · ${p.mileage ? new Intl.NumberFormat('pt-PT').format(p.mileage)+' km' : '—'} · ${p.stock_number}</div>
          ${p.client_name ? `<div class="hist-meta" style="margin-top:3px">Cliente: <b>${p.client_name}</b>${p.client_id?' ('+p.client_id+')':''}</div>` : ''}
        </div>
        <div style="text-align:right">
          ${isAdmin ? `<div class="hist-am-badge">${(p.user_email||'').split('@')[0]}</div>` : ''}
          <div class="hist-meta" style="margin-top:4px">${dt}</div>
        </div>
      </div>
      <div class="hist-prices">
        ${p.auto1_price ? `<div class="hist-price-item"><span class="lbl">Preço auto1</span><span class="val">€ ${new Intl.NumberFormat('pt-PT').format(p.auto1_price)}</span></div>` : ''}
        ${p.pvp_ideal   ? `<div class="hist-price-item"><span class="lbl">PVP Ideal</span><span class="val">€ ${new Intl.NumberFormat('pt-PT').format(p.pvp_ideal)}</span></div>` : ''}
        ${p.ideal_buy_price ? `<div class="hist-price-item"><span class="lbl">Preço ideal compra</span><span class="val">€ ${new Intl.NumberFormat('pt-PT').format(p.ideal_buy_price)}</span></div>` : ''}
        ${p.sale_status==='vendido' && p.sale_price ? `<div class="hist-price-item"><span class="lbl">Preço de venda</span><span class="val" style="color:var(--green)">€ ${new Intl.NumberFormat('pt-PT').format(p.sale_price)}</span></div>` : ''}
      </div>
      <div class="status-bar">
        <button class="st-btn nv ${(p.sale_status==='nao_vendido'||p.sale_status==='pending'&&false)?'active':''}" onclick="setStatus('${p.id}','nao_vendido')" style="${p.sale_status==='nao_vendido'?'background:#C62828;color:#fff':''}">✗ Não vendido</button>
        <button class="st-btn vd" onclick="setStatus('${p.id}','vendido')" style="${p.sale_status==='vendido'?'background:#2E7D32;color:#fff':''}">✓ Vendido</button>
        <button class="st-btn lc" onclick="setStatus('${p.id}','licitado')" style="${p.sale_status==='licitado'?'background:#E65100;color:#fff':''}">⚡ Licitado</button>
        ${p.sale_status==='vendido' ? `
        <div class="ci-wrap" style="margin-left:8px">
          <input type="checkbox" id="ci-${p.id}" ${p.compra_imediata?'checked':''} onchange="toggleCI('${p.id}',this.checked)">
          <label for="ci-${p.id}">Compra Imediata</label>
        </div>` : ''}
      </div>
      ${p.sale_status==='vendido' ? `
      <div class="sale-fields">
        <input placeholder="ID da venda" value="${p.sale_id||''}" onchange="updateSaleField('${p.id}','sale_id',this.value)" style="width:140px">
        <input placeholder="Preço de venda (€)" type="number" value="${p.sale_price||''}" onchange="updateSaleField('${p.id}','sale_price',parseFloat(this.value)||null)" style="width:175px">
      </div>` : ''}
      ${p.message ? `<span class="hist-msg-toggle" onclick="toggleMsg('${p.id}')">Ver mensagem ▾</span>
      <div class="hist-msg" id="hmsg-${p.id}">${p.message}</div>` : ''}
    </div>`;
  }).join('');
}

function toggleMsg(id) {
  const el = document.getElementById(`hmsg-${id}`);
  if (el) el.style.display = el.style.display==='none'||!el.style.display?'block':'none';
}

async function setStatus(id, status) {
  await sb.from('proposals').update({sale_status:status}).eq('id',id);
  const p = proposals.find(x=>x.id===id);
  if (p) p.sale_status=status;
  renderHistory(); renderVendas();
}

async function toggleCI(id, val) {
  await sb.from('proposals').update({compra_imediata:val}).eq('id',id);
  const p = proposals.find(x=>x.id===id);
  if (p) p.compra_imediata=val;
  renderVendas();
}

async function updateSaleField(id, field, val) {
  await sb.from('proposals').update({[field]:val}).eq('id',id);
  const p = proposals.find(x=>x.id===id);
  if (p) p[field]=val;
  renderVendas();
}

// ── VENDAS ────────────────────────────────────────────────────────────────
function renderVendas() {
  const vendidos  = proposals.filter(p=>p.sale_status==='vendido');
  const licitados = proposals.filter(p=>p.sale_status==='licitado');
  const ci        = vendidos.filter(p=>p.compra_imediata);
  const vol       = vendidos.reduce((s,p)=>s+(p.sale_price||0),0);
  document.getElementById('vendas-stats').innerHTML = `
    <div class="stat-card"><div class="lbl">Vendidos</div><div class="val" style="color:var(--green)">${vendidos.length}</div><div class="sub">carros vendidos</div></div>
    <div class="stat-card"><div class="lbl">Compra Imediata</div><div class="val" style="color:var(--blue)">${ci.length}</div><div class="sub">de ${vendidos.length} vendidos</div></div>
    <div class="stat-card"><div class="lbl">Volume de Vendas</div><div class="val" style="font-size:20px">€ ${new Intl.NumberFormat('pt-PT').format(vol)}</div><div class="sub">valor total vendido</div></div>
    <div class="stat-card"><div class="lbl">Licitados</div><div class="val" style="color:var(--amber)">${licitados.length}</div><div class="sub">não ganhos</div></div>
  `;
  const vlist = document.getElementById('vendas-list');
  if (!vendidos.length) { vlist.innerHTML=''; return; }
  vlist.innerHTML = `<h3>Carros Vendidos</h3>` + vendidos.map(p=>`
    <div class="hist-item">
      <div class="hist-item-header">
        <div>
          <div class="hist-car-name">${p.make} ${p.model}</div>
          <div class="hist-car-sub">${p.built_year||'—'} · ${p.stock_number} ${p.compra_imediata?'· <b style="color:var(--blue)">Compra Imediata</b>':''}</div>
          ${p.client_name?`<div class="hist-meta">Cliente: <b>${p.client_name}</b></div>`:''}
        </div>
        ${p.sale_price?`<div style="text-align:right"><div style="font-size:18px;font-weight:800;color:var(--green)">€ ${new Intl.NumberFormat('pt-PT').format(p.sale_price)}</div><div class="hist-meta">preço de venda</div></div>`:''}
      </div>
    </div>`).join('');
}

// Initial render
renderCatalog();
</script>
